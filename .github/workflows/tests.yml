# Runs the test suite on every push and pull request.
#
# The app deploys straight from main to GitHub Pages, so main IS production:
# a broken push is live in about a minute. This is the only thing standing
# between a bad commit and the live app.
#
# No dependencies to install — the tests are plain Node with no packages.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run test suite
        run: node tests/ingest.test.js

      # Catches a truncated or malformed script tag in the page that loads
      # everything. A syntax error here takes the whole app down, and the
      # tests load these files by eval() rather than through the browser.
      - name: Check every app script parses
        run: |
          for f in app.js storage.js ingest.js pdf-parser.js brands.js \
                   attachments.js excel.js config.js debug.js; do
            node --check "$f" || exit 1
          done
          echo "All scripts parse."

      # Every local script the page loads must exist. A rename that misses
      # index.html produces a 404 the tests cannot see.
      - name: Check index.html references real files
        run: |
          missing=0
          for f in $(grep -oE '<script src="[^":]+\.js"' index.html \
                     | sed -E 's/.*src="([^"]+)".*/\1/'); do
            [ -f "$f" ] || { echo "index.html references missing file: $f"; missing=1; }
          done
          [ "$missing" = "0" ] && echo "All referenced scripts present."
          exit $missing
